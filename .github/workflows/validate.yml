name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint YAML
        run: yamllint --strict modules categories.yml site.yml .github

      - name: Validate all entries (offline)
        run: python scripts/validate.py --format github

      - name: Check changed entries against their repositories
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mapfile -t changed < <(git diff --name-only --diff-filter=AMR "origin/${BASE_REF}...HEAD" -- 'modules/*.yml')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No entry changed."
            exit 0
          fi
          python scripts/validate.py --online --format github "${changed[@]}"
          python scripts/enrich.py --no-github "${changed[@]}"

      - name: Run tests
        run: pytest -q

      - name: Build site preview
        run: python scripts/build_site.py --base-url "https://example.invalid/preview"

      - name: Upload site preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: _site
          retention-days: 7
