name: Windrose
title: Windrose · Third-party modules for Zephyr
headline: Extend Zephyr with third-party modules
# Absolute URL of the published site, without trailing slash. build_site.py --base-url overrides it.
base_url: https://zephyrproject-rtos.github.io/windrose
repository: https://github.com/zephyrproject-rtos/windrose
branch: main
docs_url: https://docs.zephyrproject.org/latest/develop/modules.html
tagline: >-
  Discover modules you can add to any Zephyr workspace to bring in new protocols,
  libraries, language runtimes and more.
# Command shown in the "west command" tab once Zephyr ships one, with {name}
# replaced by the module name, e.g. "west modules add {name}". null hides the tab.
west_command: null
