title: Zephyr Community Modules
# Absolute URL of the published site, without trailing slash. build_site.py --base-url overrides it.
base_url: https://zephyrproject-rtos.github.io/community-modules
repository: https://github.com/zephyrproject-rtos/community-modules
branch: main
docs_url: https://docs.zephyrproject.org/latest/develop/modules.html
tagline: >-
  A catalog of Zephyr modules maintained by the community outside the main Zephyr
  repository, from protocol stacks and libraries to language runtimes and tools,
  each ready to add to a west workspace.
# Command shown in the "west command" tab once Zephyr ships one, with {name}
# replaced by the module name, e.g. "west modules add {name}". null hides the tab.
west_command: null
