name: lz4
title: LZ4
summary: >-
  Lossless compression at over 500 MB/s per core, with a decoder running at multiple GB/s.
description: |
  LZ4 is a lossless compression algorithm, providing compression speed greater than 500 MB/s per
  core, scalable with multi-core CPUs. It features an extremely fast decoder, with speed in
  multiple GB/s per core, typically reaching RAM speed limits on multi-core systems.

  Speed can be tuned dynamically by selecting an "acceleration" factor, which trades compression
  ratio for faster speed. On the other end, a high compression derivative, LZ4_HC, is also
  provided, trading CPU time for improved compression ratio. All versions feature the same
  decompression speed.

  LZ4 is also compatible with dictionary compression, both at API and CLI levels. It can ingest
  any input file as a dictionary, though only the final 64KB are used. This capability can be
  combined
