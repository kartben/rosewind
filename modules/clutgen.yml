name: clutgen
title: CLUTGen
summary: >-
  Generates calibrated lookup tables at build time to turn raw ADC readings into physical units.
description: |
  [CLUTGen](https://github.com/wkhadgar/clutgen-zephyr) automates the creation of **Look-Up
  Tables** for embedded systems, converting raw ADC readings into calibrated physical units such
  as temperature, pressure, or distance.

  Given a set of calibration samples, CLUTGen fits an interpolation curve and generates a
  production-ready `.c`/`.h` pair with the full LUT precomputed for every possible ADC reading. At
  runtime, conversion is a single array index operation, so you can trade costly RAM operations
  from `math.h` and other similar libraries for a constant and predictable ROM cost.

  This Zephyr module integrates CLUTGen directly into the west build system. LUT generation runs
  at CMake configure time and the generated files are automatically linked into the application.
category: tools
tags: [adc, calibration, codegen]
license: Apache-2.0
maintainers:
  - github: wkhadgar
links:
  repository: https://github.com/wkhadgar/clutgen-zephyr
