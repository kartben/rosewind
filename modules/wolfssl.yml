name: wolfssl
title: wolfSSL
summary: >-
  TLS 1.3 and DTLS 1.3 library with a broad crypto engine, including post-quantum algorithms.
description: |
  wolfSSL is a lightweight, portable SSL/TLS library optimized for embedded systems, RTOS
  environments, and resource-constrained devices. It offers a range of cryptographic functions,
  and secure communication protocols (up to TLS 1.3 and DTLS 1.3) along with post-quantum
  cryptography support. Its support for multiple build configurations makes it suitable for a wide
  range of applications and hardware platforms that are utilizing the Zephyr RTOS.

  wolfSSL has support for the Zephyr networking stack so applications can use the wolfSSL API to
  establish secure connections with other devices or services over the network.

  wolfSSL is dual licensed under GPLv3 and commercial licenses.
category: security
keywords: [pqc]
license: GPL-3.0-or-later
maintainers:
  - github: wolfssl
links:
  repository: https://github.com/wolfssl/wolfssl
  documentation: https://www.wolfssl.com/docs/
west:
  revision: master
  path: modules/crypto/wolfssl
