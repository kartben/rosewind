name: xedge
title: Xedge
summary: >-
  Lua-based IoT and web application framework built on the Barracuda App Server.
description: |
  Xedge is a secure, embedded web and IoT edge framework designed for resource-constrained devices
  and RTOS environments. It is built on the Barracuda App Server technology and provides a
  high-level, Lua-based application environment for developing secure, network-connected devices.

  Xedge is licensed under the GPLv2 license with a commercial license option.
