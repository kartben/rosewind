name: ludlc
title: LuDLC
summary: >-
  Transport-agnostic data-link protocol for resource-constrained links such as UART or SPI.
description: |
  LuDLC (Lightweight Micro Devices Link Control), a transport-agnostic data-link protocol for
  resource-constrained systems.

  LuDLC delivers reliable, in-order communication over simple transports, such as UART and SPI, or
  CAN bus, without requiring a full network stack. It provides flow control, retransmission,
  connection management, and channel multiplexing, making it suitable for scenarios where TCP/IP
  is too heavy or unavailable.

  LuDLC is dual-licensed under (Apache-2.0 OR GPL-2.0-or-later) licenses.
category: communication
keywords: [serial, framing]
license: Apache-2.0 OR GPL-2.0-only
maintainers:
  - github: avolkov-1221
links:
  repository: https://github.com/avolkov-1221/ludlc
  examples: https://github.com/avolkov-1221/ludlc/tree/main/src/samples
